name: Scheduled Scraper

on:
  schedule:
    # Run once a day at 09:00 UTC (12:00 Turkish time) to save GitHub Action minutes
    - cron: '0 9 * * *'
  # Enable manual execution from the scheduled workflow page too
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: database.db
          # Use a dynamic key so a new cache entry is always written at the end.
          # The restore-keys prefix ensures we download the most recent run's DB.
          key: database-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            database-

      - name: Run Pipeline (Single execution)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_once.py

      - name: Save SQLite Database Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: database.db
          key: database-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-backup-${{ github.run_id }}
          path: database.db
          retention-days: 14

